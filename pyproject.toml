[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pac2026-algorithms"
version = "0.2.0"
description = "Observation datasets and learned pallet candidate evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
ahead-planner = "projects.pattern_evaluation.__main__:main"

[tool.setuptools.packages.find]
include = ["pacdata*", "projects", "projects.pattern_evaluation*"]

[tool.setuptools.package-data]
"projects.pattern_evaluation" = ["config.json", "artifacts/*.json"]
