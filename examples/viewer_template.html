<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AHEAD 탑뷰 관측 데이터</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0f5f5;color:#17333b;font:15px/1.7 system-ui,"Malgun Gothic",sans-serif}header{background:#163e49;color:white;padding:26px max(22px,calc((100vw - 1120px)/2));}header p{color:#cce1e1;margin:6px 0 0}h1{font-size:27px;margin:0}h2{font-size:19px;margin:0 0 13px}main{max-width:1164px;margin:auto;padding:22px}.panel{border:1px solid #d6e3e4;background:white;border-radius:12px;padding:22px;margin-bottom:18px}.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}.stat{background:#f2f8f6;border-radius:8px;padding:12px 18px;flex:1;min-width:160px}.stat b{display:block;font-size:25px}.stat small,.muted{color:#59717a}select{font:inherit;border:1px solid #b4cbd0;border-radius:7px;padding:8px;max-width:100%}svg{width:100%;height:auto;display:block;background:#f9fbfc;border-radius:10px}.legend span{display:inline-block;margin:12px 22px 0 0;font-size:13px}.green{color:#087e63}.amber{color:#a4660b}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;text-align:left;border-bottom:1px solid #dbe7e8}th{color:#59717a;font-size:12px}.scroll{overflow:auto}pre{background:#15313b;color:#d9eeea;padding:18px;border-radius:8px;max-height:390px;overflow:auto;white-space:pre-wrap;font:12px/1.6 monospace}summary{cursor:pointer}.note{border-left:3px solid #23a88b;padding-left:14px}footer{color:#59717a;font-size:12px;margin:0 24px 24px;text-align:center}@media(max-width:600px){main{padding:12px}.panel{padding:16px}h1{font-size:22px}.stat{min-width:120px}}
</style></head><body><header><small>AHEAD / SYNTHETIC TOP-VIEW / DATASET V2</small><h1>넓게 관측하고, 확실한 순서만 사용하기</h1><p>카메라 관측 상한 2 · 4 · 8 · 12개 / 가림 · 재측정 / 학습 입력 확인</p></header><main><section class="panel"><div class="row"><label>조건 <select id="scenario" onchange="render()"><option value="random">무작위 입고</option><option value="large_last">큰 박스 후반</option><option value="occlusion_gap">가림·검출 누락</option><option value="measurement_recheck">현재 박스 재측정</option></select></label><label>관측 상한 <select id="camera" onchange="render()"><option value="preview2">2개 / 1.1 m</option><option value="topview4">4개 / 2 m</option><option value="topview8" selected>8개 / 3.8 m</option><option value="topview12">12개 / 5.6 m</option></select></label></div><p class="muted">같은 조건에서 관측 상한을 바꾸면 같은 재고·입고 순서·처리 단계의 관측을 비교합니다. 그림은 합성 검출 결과의 도식입니다.</p></section><div id="view"></div></main><footer>실제 CCTV 영상·영상 인식 모델·로봇 경로·물리 시뮬레이션은 연결되어 있지 않습니다.</footer><script id="payload" type="application/json">__OBSERVATIONS__</script><script>
const RECORDS=JSON.parse(document.getElementById('payload').textContent);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n*1000)/10;
function render(){
 const r=RECORDS.find(x=>x.scenario===document.getElementById('scenario').value&&x.camera_profile===document.getElementById('camera').value),o=r.observation;
 const prefix=o.observed_preview,hints=o.unordered_visible_hints,b=o.current_box;
 const all=[...prefix,...hints].sort((a,b)=>a.belt_distance_m-b.belt_distance_m),ids=new Set(prefix.map(t=>t.track_id));
 const unknown=Object.values(o.unseen_inventory).reduce((a,b)=>a+b,0),remaining=unknown+prefix.length+(b?1:0);
 let svg='<svg viewBox="0 0 1040 255" role="img" aria-label="합성 탑뷰 컨베이어 관측"><rect x="110" y="55" width="880" height="150" rx="8" fill="#e7eef0" stroke="#a8bfc5"/><text x="18" y="92" font-size="13" fill="#163e49">적재 지점</text><text x="20" y="120" font-size="23" fill="#163e49">←</text><text x="110" y="32" font-size="12" fill="#59717a">0 m / 가까운 박스부터 확인</text><text x="820" y="32" font-size="12" fill="#59717a">시야 '+o.camera.fov_length_m+' m</text>';
 for(const t of all){const bb=t.bbox_normalized,known=ids.has(t.track_id),x=110+bb[0]*880,y=55+bb[1]*150,w=(bb[2]-bb[0])*880,h=(bb[3]-bb[1])*150;svg+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(known?'#75cbb0':'#edc17b')+'" stroke="'+(known?'#087f63':'#ad7623')+'" '+(known?'':'stroke-dasharray="5 3"')+'/><text x="'+(x+4)+'" y="'+(y+16)+'" font-size="11" fill="#163e49">'+t.sku+'</text><text x="'+(x+4)+'" y="'+(y+h+19)+'" font-size="10" fill="#59717a">'+(known?'순서 '+t.verified_order_rank:'불확실')+'</text>';}
 svg+='<text x="110" y="240" font-size="11" fill="#59717a">빈 공간의 보이지 않는 박스는 도식에 정답 위치로 추가하지 않습니다.</text></svg>';
 const table=all.map(t=>'<tr><td>'+t.sku+'</td><td class="'+(ids.has(t.track_id)?'green':'amber')+'">'+(ids.has(t.track_id)?t.verified_order_rank+'번째 확인':'순서 미확정')+'</td><td>'+t.dimensions_m.map(fmt).join(' × ')+'</td><td>'+t.nominal_mass_kg+'</td><td>'+t.confidence+'</td></tr>').join('');
 document.getElementById('view').innerHTML='<section class="panel"><h2>현재와 미래 정보</h2><div class="row"><div class="stat"><small>현재 박스</small><b>'+(b?b.sku:'없음')+'</b>'+(b?(b.measurement_valid?'측정 완료':'재측정 필요'):'입력 완료')+'</div><div class="stat"><small>순서 확인 연속 구간</small><b>'+prefix.length+'개</b>관측 상한 '+o.camera.max_tracks+'개</div><div class="stat"><small>불확실한 관측</small><b>'+hints.length+'개</b>미관측 수량에 포함</div><div class="stat"><small>미관측 전체</small><b>'+unknown+'개</b>실제 순서는 입력하지 않음</div></div><p class="note">'+(o.camera.coverage_complete?'추적 연속성 플래그가 확인된 구간의 순서를 사용합니다.':'가림·누락 구간이 있어 뒤에 보이는 박스를 바로 다음 순서로 연결하지 않습니다.')+'</p>'+svg+'<div class="legend"><span class="green">초록: 순서 확인된 미리보기</span><span class="amber">노랑 점선: 불확실한 관측</span></div></section><section class="panel"><h2>관측된 박스 규격</h2><div class="scroll"><table><thead><tr><th>SKU</th><th>순서</th><th>길이 × 폭 × 높이 cm</th><th>공칭 kg</th><th>합성 신뢰도</th></tr></thead><tbody>'+table+'</tbody></table></div><p class="muted">길이·폭: 합성 탑뷰 추정 / 높이·무게: SKU 카탈로그. 카메라가 무게·높이를 직접 측정한 결과가 아닙니다.</p><p>남은 전체 '+remaining+'개 = 현재 '+(b?1:0)+' + 확인된 다음 '+prefix.length+' + 미관측 '+unknown+'. 불확실한 관측 '+hints.length+'개는 다시 더하지 않습니다.</p><p class="muted">이전에 처리한 입력 '+r.processed+'개 · 실제 성공 배치 '+o.placed_boxes.length+'개. 미리보기에는 박스가 보여도 현재 측정 오류가 있으면 먼저 재측정합니다.</p></section><section class="panel"><h2>AI가 받는 관측 입력</h2><details><summary>정책 입력 JSON 보기</summary><pre>'+esc(JSON.stringify(o,null,2))+'</pre></details><p class="muted">원본의 oracle.arrivals 전체는 이 화면과 정책 입력에 포함되지 않습니다. 카메라 추적의 연속성 플래그와 SKU 확인은 실제 시스템에서 검증해 연결할 항목입니다.</p></section>';
}
render();
</script></body></html>
