name: Core checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s projects/pattern_evaluation/tests -v
      - run: python -m pacdata.generate --config configs/smoke.json --out data/smoke
      - run: python -m pacdata.labels --dataset data/smoke --config configs/labels_smoke.json --out data/labels_smoke
      - run: python -m pacdata.validate --dataset data/smoke --labels data/labels_smoke
